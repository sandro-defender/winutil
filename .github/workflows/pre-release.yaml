name: Pre-Release WinUtil

permissions:
  contents: write
  actions: read
  pull-requests: write

on:
  workflow_dispatch: # Manual trigger added

jobs:
  build-runspace:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    env:
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Dev Docs and Update JSON Links
        shell: pwsh
        run: |
          Set-Location tools
          ./devdocs-generator.ps1

      - name: Set version from Git tag
        id: extract_version
        run: |
          $version = (Get-Date -Format "yy.MM.dd")
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create tag
        id: create_tag
        run: |
          $tagExists = git tag -l $env:VERSION
          if ($tagExists -eq "") {
            git tag $env:VERSION
            git push origin $env:VERSION
          }
        shell: pwsh

      - name: Compile and sign release files
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { throw "CERTIFICATE_BASE64 is required to sign WinUtilLauncher.exe." }
          $certificatePath = Join-Path $env:RUNNER_TEMP "winutil-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $compileParameters = @{ Sign = $true; CertificatePath = $certificatePath }
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            $compileParameters.CertificatePassword = ConvertTo-SecureString -String $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          }
          Set-ExecutionPolicy Bypass -Scope Process -Force
          ./compiler/Compile.ps1 @compileParameters
        continue-on-error: false # Directly fail the job on error, removing the need for a separate check

      - name: Create Pull Request for Updated Docs and JSON Links
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MERGE }}
          commit-message: 'chore: Update generated dev docs and JSON links'
          title: 'chore: Update generated dev docs and JSON links'
          body: 'Automated update of generated documentation and JSON config links from pre-release build'
          branch: docs-update
          delete-branch: true
          add-paths: |
            docs/src/content/docs/code-reference/
            config/tweaks.json
            config/feature.json
          labels: |
            automated
            documentation
            skip-changelog

      - name: Check outputs
        shell: bash
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: winutil-release
          path: |
            ./compiled/winutil.ps1
            ./compiled/WinUtilLauncher.exe

  release:
    needs: build-runspace
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: winutil-release

      - name: Set version from build job
        run: echo "VERSION=${{ needs.build-runspace.outputs.version }}" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: generate_notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          version: ${{ env.VERSION }}

      - name: Remove Automated Updates from Release Notes
        id: filter_notes
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.generate_notes.outputs.body }}
        run: |
          $filteredNotes = ($env:RELEASE_NOTES -split '\r?\n' | Where-Object {
            $_ -notmatch '(?i)Update (Generated Dev Docs|Sponsors)'
          }) -join "`n"

          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $filteredNotes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Pre-Release ${{ env.VERSION }}
          body: |
            ${{ steps.filter_notes.outputs.body }}

            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/ChrisTitusTech/winutil/${{ env.VERSION }}/winutil.ps1)
          append_body: false
          files: |
            ./winutil.ps1
            ./WinUtilLauncher.exe
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
